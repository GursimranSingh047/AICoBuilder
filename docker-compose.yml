version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: projectpilot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: projectpilot
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: pilotpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilot -d projectpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: projectpilot_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pilot:pilotpass@db:5432/projectpilot
      SECRET_KEY: ${SECRET_KEY:-changeme-in-production-32chars!!}
      _API_KEY: ${_API_KEY:-}
      _MODEL: -1.5-flash
      DEBUG: "false"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
    ports:
      - "8000:8000"
    volumes:
      - generated_projects:/app/generated_projects
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (placeholder – add when ready) ─────────────────────────────────
  # frontend:
  #   build:
  #     context: ./frontend
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend

volumes:
  postgres_data:
  generated_projects:
  backend_logs:
